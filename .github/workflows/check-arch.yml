name: Check for new Arch release

on:
  schedule:
    - cron: '0 20 * * *' # 04:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      should_force_build:
        description: Trigger an image build even if the rootfs MD5 is unchanged
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: check-arch
  cancel-in-progress: false

env:
  ARCH_ROOTFS_MD5_URL: http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz.md5

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Read current rootfs MD5
        id: current_md5
        run: |
          set -euo pipefail
          current=$(curl -fsSL "$ARCH_ROOTFS_MD5_URL" | awk '{print $1}')
          [ -n "$current" ] || { echo "Error: could not read the ALARM rootfs MD5" >&2; exit 1; }
          echo "value=$current" >> "$GITHUB_OUTPUT"
          echo "Current ALARM rootfs MD5: $current"

      - name: Restore last seen MD5
        uses: actions/cache/restore@v5
        with:
          path: arch-state
          key: arch-md5-state-${{ steps.current_md5.outputs.value }}
          restore-keys: |
            arch-md5-state-

      - name: Compare with last seen MD5
        id: arch_md5
        run: |
          set -euo pipefail
          current="${{ steps.current_md5.outputs.value }}"
          stored=$(cat arch-state/last_md5.txt 2>/dev/null || true)

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "stored=$stored" >> "$GITHUB_OUTPUT"

          if [ "$current" != "$stored" ]; then
            echo "has_changed=true" >> "$GITHUB_OUTPUT"
            echo "Rootfs MD5 changed: ${stored:-<none>} -> $current"
          else
            echo "has_changed=false" >> "$GITHUB_OUTPUT"
            echo "Rootfs MD5 unchanged: $current"
          fi

      - name: Record new MD5
        if: steps.arch_md5.outputs.has_changed == 'true'
        run: |
          mkdir -p arch-state
          echo "${{ steps.arch_md5.outputs.current }}" > arch-state/last_md5.txt

      - name: Trigger image build
        if: steps.arch_md5.outputs.has_changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.should_force_build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-image.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "arch_md5=${{ steps.arch_md5.outputs.current }}" \
            -f "should_publish_release=true"
          echo "Triggered build for rootfs MD5 ${{ steps.arch_md5.outputs.current }}"

      # Save only after a successful trigger so a failed trigger is retried the
      # next day instead of being silently remembered.
      - name: Save new MD5
        if: steps.arch_md5.outputs.has_changed == 'true'
        uses: actions/cache/save@v5
        with:
          path: arch-state
          key: arch-md5-state-${{ steps.arch_md5.outputs.current }}

      # Keep the workflow history small: keep the 3 newest runs of each
      # workflow and delete the rest through the API (releases are untouched).
      - name: Prune old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for workflow in check-arch.yml build-image.yml; do
            echo "::group::Pruning $workflow (keeping 3 newest runs)"
            gh run list --workflow="$workflow" --limit 1000 \
              --json databaseId,status \
              --jq '.[3:] | .[] | select(.status == "completed") | .databaseId' |
              while read -r run_id; do
                [ -n "$run_id" ] || continue
                if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1; then
                  echo "deleted run $run_id"
                else
                  echo "::warning::could not delete run $run_id"
                fi
              done
            echo "::endgroup::"
          done
