name: Check Arch rootfs update

on:
  schedule:
    - cron: '15 8,20 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch current Arch rootfs MD5
        id: current
        run: |
          md5=$(curl -fsSL http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz.md5 | awk '{print $1}')
          [ -n "$md5" ] || { echo "Error: could not fetch rootfs md5" >&2; exit 1; }
          echo "md5=$md5" >> "$GITHUB_OUTPUT"

      - name: Compare with recorded MD5
        id: compare
        run: |
          prev=$(cat .arch-rootfs-md5 2>/dev/null || echo "")
          cur="${{ steps.current.outputs.md5 }}"
          echo "recorded=$prev" >> "$GITHUB_OUTPUT"
          if [ "$prev" = "$cur" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Arch rootfs unchanged ($cur)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Arch rootfs changed: '${prev:-none}' -> '$cur'"
          fi

      - name: Trigger build
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-image.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"
