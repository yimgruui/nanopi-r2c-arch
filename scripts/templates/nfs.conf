# /etc/nfs.conf - NFS server settings for the NanoPi R2C appliance.
#
# Ports are pinned so the nftables ruleset can allow exactly the NFS services
# instead of opening a random high-port range.  Keep these in sync with
# /etc/nftables.conf and /etc/modprobe.d/nfs-lockd.conf.

[general]
pipefs-directory=/var/lib/nfs/rpc_pipefs

[nfsd]
# Four Cortex-A53 cores; eight nfsd threads are plenty for media playback.
threads=8
vers2=n
vers3=y
vers4=y
vers4.0=y
vers4.1=y
vers4.2=y
# NFSv3 over UDP is still used by some TVs; NFSv4 always uses TCP.
udp=y
tcp=y
rdma=n

[mountd]
port=20048

[statd]
port=32765
outgoing-port=32766

[lockd]
port=32768
udp-port=32768
