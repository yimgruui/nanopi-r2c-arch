[Unit]
# The appliance has one USB storage port, so the data disk is normally sda1.
# Adjust the instance name if your kernel enumerates it differently.
#
# Wants= pulls the automount unit into the boot transaction even when udev
# coldplug has not processed the disk yet, and After= makes ksmbd wait until
# the filesystem is actually mounted.
After=usb-mount@sda1.service
Wants=usb-mount@sda1.service
