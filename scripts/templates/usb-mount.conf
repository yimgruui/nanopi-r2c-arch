# Generic USB storage automounter (see /usr/local/sbin/usb-mount).
#
# Mountpoint: <MOUNT_ROOT>/<label>, then <uuid>, then usb-<kernel-name>.
# FAT/exFAT/NTFS additionally get uid=<OWNER_UID>, gid=<OWNER_GID>, umask=0022
# so the appliance user can write to the disk.
MOUNT_ROOT=/media
OWNER_UID=1000
OWNER_GID=1000

# Applied to every filesystem.  Drop noexec if you need to run executables
# from removable media.
BASE_OPTIONS=nosuid,nodev,noexec,noatime
