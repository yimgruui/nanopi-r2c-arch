[Unit]
# The exported path lives on the USB data disk.  Wants= pulls the automount
# unit into the boot transaction; After= makes nfs-server read exports only
# after the filesystem is mounted.  A missing disk skips cleanly because
# usb-mount@.service has ConditionPathExists=/dev/%i.
After=usb-mount@sda1.service
Wants=usb-mount@sda1.service
